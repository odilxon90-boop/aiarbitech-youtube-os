version: '3.8'

# Staging Environment Configuration
# Usage: docker-compose -f docker-compose.staging.yml up
# Features: Production build, JWT auth, production-like settings

services:
  # PostgreSQL Database (Cloud or Container)
  postgres:
    image: postgres:15-alpine
    container_name: youtube-os-postgres-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_os_staging}
    ports:
      - "5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Redis Cache (Required in Staging)
  redis:
    image: redis:7-alpine
    container_name: youtube-os-redis-staging
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    command: redis-server --appendonly yes
    networks:
      - staging-network

  # Backend API (Production Build)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-os-backend-staging
    environment:
      NODE_ENV: staging
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://staging.yourdomain.com}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
      RATE_LIMIT_ENABLED: "true"
      PRODUCTION_SECURITY_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - staging-network

  # Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.staging.yourdomain.com}
    container_name: youtube-os-frontend-staging
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - staging-network

volumes:
  postgres_staging_data:
  redis_staging_data:

networks:
  staging-network:
    driver: bridge
