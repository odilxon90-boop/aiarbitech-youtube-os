# fly.toml - Staging Environment Configuration
# Deploy: flyctl deploy --config deploy/staging/fly.toml

app = "aiarbitech-youtube-os-staging"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "../../backend/Dockerfile"

[env]
  NODE_ENV = "staging"
  PORT = "3000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  RATE_LIMIT_ENABLED = "true"
  PRODUCTION_SECURITY_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
