server {
    listen 80;
    listen [::]:80;
    server_name youtube-os.aiarbitech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name youtube-os.aiarbitech.com;

    ssl_certificate /etc/letsencrypt/live/youtube-os.aiarbitech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youtube-os.aiarbitech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Connection "";
    }

    location / {
        root /var/www/youtube-os-frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
