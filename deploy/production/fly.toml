# fly.toml - Production Environment Configuration
# Deploy: flyctl deploy --config deploy/production/fly.toml

app = "aiarbitech-youtube-os"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "../../backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "warn"
  RATE_LIMIT_ENABLED = "true"
  PRODUCTION_SECURITY_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

# Scale configuration for production
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 1024

# Auto-scaling configuration
[autoscale]
  enabled = true
  min_machines = 2
  max_machines = 10
  target_cpu_percent = 70
