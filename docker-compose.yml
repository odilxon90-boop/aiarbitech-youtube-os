services:
  postgres:
    image: postgres:16-alpine
    container_name: aiarbitech-youtube-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: youtube_os
      POSTGRES_PASSWORD: youtube_os
      POSTGRES_DB: youtube_os
    ports:
      - "5433:5432"
    volumes:
      - youtube_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_os -d youtube_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiarbitech-youtube-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - youtube_os_redis_data:/data
    command: redis-server --appendonly yes --requirepass youtube_os
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "youtube_os", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiarbitech-youtube-os-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://youtube_os:youtube_os@postgres:5432/youtube_os
      REDIS_URL: redis://:youtube_os@redis:6379/0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiarbitech-youtube-os-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_PLATFORM_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  youtube_os_postgres_data:
  youtube_os_redis_data:
