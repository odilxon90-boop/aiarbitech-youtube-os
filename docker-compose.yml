services:
  postgres:
    image: postgres:16-alpine
    container_name: aiarbitech-youtube-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: youtube_os
      POSTGRES_PASSWORD: youtube_os
      POSTGRES_DB: youtube_os
    ports:
      - "5433:5432"
    volumes:
      - youtube_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_os -d youtube_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  youtube_os_postgres_data:
