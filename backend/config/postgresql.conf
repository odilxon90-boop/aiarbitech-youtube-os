# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL Performance Configuration — YouTube OS
# Tuned for production workload; assumes 4GB RAM (adjust per actual server RAM)
# ─────────────────────────────────────────────────────────────────────────────

# ─── Connections ─────────────────────────────────────────────────────────────

max_connections = 200                      # Max concurrent client connections

# ─── Memory ──────────────────────────────────────────────────────────────────

shared_buffers = 1GB                       # 25% of RAM (adjust: RAM * 0.25)
work_mem = 16MB                            # Per-sort/hash operation (max_connections * work_mem)
maintenance_work_mem = 256MB               # VACUUM, CREATE INDEX, ALTER TABLE
effective_cache_size = 3GB                 # 75% of RAM — planner estimate of OS page cache

# ─── WAL (Write-Ahead Logging) ────────────────────────────────────────────────

wal_buffers = 16MB                         # WAL write buffer (auto-tuned from shared_buffers)
wal_level = replica                        # Minimum WAL for streaming replication
max_wal_size = 2GB                         # Max WAL size before checkpoint
min_wal_size = 256MB                       # Minimum WAL retained between checkpoints
checkpoint_completion_target = 0.9        # Spread checkpoint writes over 90% of interval
checkpoint_timeout = 10min                 # Max time between automatic checkpoints

# ─── Query Planner ───────────────────────────────────────────────────────────

random_page_cost = 1.1                     # SSDs: set to 1.1; HDDs: 4.0
effective_io_concurrency = 200             # Concurrent I/O ops (200 for SSDs, 2 for HDDs)
default_statistics_target = 100            # Statistics samples for better query plans

# ─── Parallel Query ──────────────────────────────────────────────────────────

max_worker_processes = 8                   # Total background worker processes
max_parallel_workers_per_gather = 4        # Max workers per parallel query
max_parallel_workers = 8                   # Max total parallel workers
max_parallel_maintenance_workers = 2       # Max workers for VACUUM, CREATE INDEX

# ─── Logging ─────────────────────────────────────────────────────────────────

log_min_duration_statement = 1000         # Log queries taking > 1 second (ms)
log_checkpoints = on                      # Log checkpoint activity
log_connections = off                     # Avoid excessive connection logging in production
log_disconnections = off
log_lock_waits = on                       # Log lock waits > deadlock_timeout
log_temp_files = 64MB                     # Log temp files larger than 64MB
log_autovacuum_min_duration = 500         # Log autovacuum runs taking > 500ms

# ─── Autovacuum ──────────────────────────────────────────────────────────────

autovacuum = on
autovacuum_max_workers = 3                # Max concurrent autovacuum workers
autovacuum_naptime = 30s                  # Time between autovacuum runs per database
autovacuum_vacuum_scale_factor = 0.05     # Vacuum at 5% dead tuples (default 0.2)
autovacuum_analyze_scale_factor = 0.025   # Analyze at 2.5% new tuples (default 0.1)
autovacuum_vacuum_cost_delay = 2ms        # Lower cost delay = more aggressive vacuum

# ─── Connection Pooling ───────────────────────────────────────────────────────
# Note: Use PgBouncer in production for connection pooling.
# These settings assume PgBouncer or similar is sitting in front.

# ─── Lock Management ────────────────────────────────────────────────────────

deadlock_timeout = 1s                     # Time before deadlock detection runs
lock_timeout = 30s                        # Cancel query waiting >30s for lock
statement_timeout = 60s                   # Cancel query running >60s

# ─── Resource Usage ──────────────────────────────────────────────────────────

temp_file_limit = 2GB                     # Max temp file size per session
