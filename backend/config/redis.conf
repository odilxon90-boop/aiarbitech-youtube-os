# ─────────────────────────────────────────────────────────────────────────────
# Redis Performance Configuration — YouTube OS
# Tuned for production caching workload; assumes 4GB RAM
# ─────────────────────────────────────────────────────────────────────────────

# ─── Network ─────────────────────────────────────────────────────────────────

bind 127.0.0.1                             # Bind to localhost only (Docker: 0.0.0.0)
port 6379
protected-mode yes
tcp-backlog 511                            # TCP listen backlog queue
timeout 300                                # Close idle connections after 300s
tcp-keepalive 60                           # TCP keepalive ping interval (seconds)

# ─── Memory ──────────────────────────────────────────────────────────────────

maxmemory 3gb                              # 75% of RAM (adjust: RAM * 0.75)
maxmemory-policy allkeys-lru               # Evict least-recently-used keys when maxmemory reached
maxmemory-samples 10                       # Sample size for LRU approximation (higher = more accurate)

# ─── Persistence — RDB Snapshots ─────────────────────────────────────────────

save 60 1000                               # Snapshot every 60s if ≥1000 keys changed
save 300 100                               # Snapshot every 5m if ≥100 keys changed
save 3600 1                                # Snapshot every 1h if ≥1 key changed

rdbcompression yes                         # LZF compress RDB snapshots
rdbchecksum yes                            # CRC64 checksum on RDB files
dbfilename dump.rdb
dir /var/lib/redis

# ─── Persistence — AOF (Append-Only File) ───────────────────────────────────

appendonly yes                             # Enable AOF for durability
appendfilename "appendonly.aof"
appendfsync everysec                       # Fsync every second (balance durability vs performance)
no-appendfsync-on-rewrite no               # Fsync during AOF rewrite
auto-aof-rewrite-percentage 100            # Trigger rewrite when AOF grows 100% from last rewrite
auto-aof-rewrite-min-size 128mb            # Minimum AOF size before triggering rewrite
aof-rewrite-incremental-fsync yes          # Fsync AOF rewrite incrementally
aof-use-rdb-preamble yes                   # Use RDB format as AOF preamble (faster load)

# ─── Performance ────────────────────────────────────────────────────────────

hz 15                                      # Background tasks frequency (default 10; 15 for responsiveness)
dynamic-hz yes                             # Adapt hz based on connected clients
lazyfree-lazy-eviction yes                 # Non-blocking eviction (async key deletion)
lazyfree-lazy-expire yes                   # Non-blocking expiry processing
lazyfree-lazy-server-del yes               # Non-blocking DEL command
replica-lazy-flush yes                     # Non-blocking FLUSHALL/FLUSHDB on replica sync

# ─── Slow Log ───────────────────────────────────────────────────────────────

slowlog-log-slower-than 10000              # Log commands slower than 10ms (microseconds)
slowlog-max-len 256                        # Max number of slow log entries

# ─── Keyspace Notifications ─────────────────────────────────────────────────

notify-keyspace-events ""                  # Disabled by default (enable for pub/sub expiry tracking)

# ─── Connections ─────────────────────────────────────────────────────────────

maxclients 1000                            # Max concurrent client connections

# ─── Latency Monitoring ──────────────────────────────────────────────────────

latency-monitor-threshold 100              # Flag events taking > 100ms

# ─── Cluster (Disabled — standalone mode) ───────────────────────────────────

cluster-enabled no

# ─── Active Memory Defragmentation ───────────────────────────────────────────

activedefrag yes                           # Enable active memory defragmentation
active-defrag-ignore-bytes 100mb           # Start defrag when fragmentation > 100mb
active-defrag-enabled yes
active-defrag-threshold-lower 10           # Start defrag at 10% fragmentation ratio
active-defrag-threshold-upper 100          # Max defrag effort at 100% fragmentation
active-defrag-cycle-min 1                  # Min CPU % for defrag cycle
active-defrag-cycle-max 25                 # Max CPU % for defrag cycle
