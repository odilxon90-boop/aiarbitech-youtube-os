        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/gateway/logs:
    get:
      tags:
        - IntegrationGateway
      summary: Return gateway call logs.
      description: Returns recent integration gateway call logs with outcomes and latency.
      security:
        - BearerToken: []
      x-permission: gateway:access
      parameters:
        - name: endpointId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Gateway logs returned.
          content:
