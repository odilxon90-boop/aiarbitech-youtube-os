        - BearerToken: []
      x-permission: twin:access
      responses:
        '200':
          description: Creator insights returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [insights]
                    properties:
                      insights:
                        type: array
                        items:
                          $ref: '#/components/schemas/TwinInsight'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/twin/recommendations:
    get:
      tags:
        - CreatorTwin
      summary: Return AI recommendations.
      description: Returns personalized recommendations for content, scheduling, and growth.
      security:
        - BearerToken: []
      x-permission: twin:access
      responses:
        '200':
          description: Recommendations returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [recommendations]
                    properties:
                      recommendations:
                        type: array
                        items:
                          $ref: '#/components/schemas/TwinRecommendation'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'


  # ============================================================================
  # Integration Gateway
  # ============================================================================
  /api/v1/gateway/endpoints:
    get:
      tags:
        - IntegrationGateway
      summary: List integration endpoints.
      description: Returns all configured Global Ecosystem integration endpoints with status.
      security:
        - BearerToken: []
      x-permission: gateway:access
      responses:
        '200':
          description: Integration endpoints returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [endpoints]
                    properties:
                      endpoints:
                        type: array
                        items:
                          $ref: '#/components/schemas/GatewayEndpoint'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/gateway/call:
    post:
      tags:
        - IntegrationGateway
      summary: Execute a gateway call.
      description: Executes a call to a Global Ecosystem integration endpoint.
      security:
        - BearerToken: []
      x-permission: gateway:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId, method]
              properties:
                endpointId:
                  type: string
                  description: ID of the integration endpoint.
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE]
                path:
                  type: string
                  description: Optional path override.
                body:
                  type: object
                  description: Optional request body.
      responses:
        '200':
          description: Gateway call completed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/GatewayCallResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/gateway/logs:
    get:
      tags:
        - IntegrationGateway
      summary: Return gateway call logs.
      description: Returns recent integration gateway call logs with outcomes and latency.
      security:
        - BearerToken: []
      x-permission: gateway:access
      parameters:
        - name: endpointId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Gateway logs returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [logs]
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/GatewayLog'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service Bearer token. Mandatory for every operation.

  schemas:
    Meta:
      type: object
      required: [correlationId, timestamp]
      properties:
        correlationId:
          type: string
          description: Request correlation identifier.
          example: "9f3a7c1e-5b4d-4f8a-9d1e-1a2b3c4d5e6f"
        timestamp:
          type: string
          format: date-time
          description: Response generation timestamp (ISO 8601 UTC).

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: Field that caused the error, when applicable.
        reason:
          type: string
          description: Machine-readable reason for the error.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId, retryable]
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message.
            correlationId:
              type: string
              description: Correlation identifier of the failed request.
            retryable:
              type: boolean
              description: Whether the client may retry the request.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    PlatformManifest:
      type: object
      required:
        - platformId
        - platformName
        - platformVersion
        - architectureModel
        - integrationModel
        - deploymentModel
        - dataOwnership
        - repositoryType
        - globalDatabaseAccess
        - crossPlatformDatabaseAccess
        - status
        - globalEcosystemCompatibility
      properties:
        platformId:
          type: string
          example: PLATFORM_YOUTUBE_OS
        platformName:
          type: string
          example: AIArbiTech YouTube OS
        platformVersion:
          type: string
          example: 0.1.0
        architectureModel:
          type: string
          enum: [INDEPENDENT_PLATFORM_SERVICE]
        integrationModel:
          type: string
          enum: [API_AND_EVENT_CONTRACTS]
        deploymentModel:
          type: string
          enum: [INDEPENDENT]
        dataOwnership:
          type: string
          enum: [PLATFORM_OWNED]
        repositoryType:
          type: string
          enum: [INDEPENDENT]
        globalDatabaseAccess:
          type: string
          enum: [PROHIBITED]
        crossPlatformDatabaseAccess:
          type: string
          enum: [PROHIBITED]
        status:
          type: string
          example: FOUNDATION_INITIALIZED
        globalEcosystemCompatibility:
          type: object
          required: [overall, capabilities]
          properties:
            overall:
              type: string
              example: NOT_VERIFIED
            capabilities:
              type: array
              items:
                $ref: '#/components/schemas/CompatibilityCapability'

    CompatibilityCapability:
      type: object
      required: [name, compatibility]
      properties:
        name:
          type: string
          example: Identity
        compatibility:
          type: string
          example: NOT_VERIFIED

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Platform liveness/readiness status.
          example: READY
        checks:
          type: object
          additionalProperties:
            type: string
          description: Named readiness checks and their states.

    CompatibilityReport:
      type: object
      required:
        - platformId
        - contractVersion
        - integrationConfigured
        - networkRequestPerformed
        - status
        - capabilities
        - checkedAt
      properties:
        platformId:
          type: string
        contractVersion:
          type: string
          example: v1
        integrationConfigured:
          type: boolean
        networkRequestPerformed:
          type: boolean
          example: false
        status:
          type: string
          example: NOT_VERIFIED
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityCapability'
        checkedAt:
          type: string
          format: date-time

    PlatformPassport:
      type: object
      description: Repository identity and gate metadata (passport). Shape is repository-derived.
      additionalProperties: true
    Feature:
      type: object
      required: [id, name, classification, status]
      properties:
        id:
          type: string
          example: CHANNEL_MANAGEMENT
        name:
          type: string
          example: Channel Management
        classification:
          type: string
          enum: [FOUNDATION_GOVERNANCE, BUSINESS]
        status:
          type: string
          enum: [IMPLEMENTED, NOT_IMPLEMENTED]
        evidenceOrigin:
          type: string

    FeatureRegistry:
      type: object
      required: [schemaVersion, artifactVersion, features]
      properties:
        schemaVersion:
          type: string
          example: 1.0.0
        artifactVersion:
          type: string
          example: 1.0.0
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        evidence:
          type: object

    Capability:
      type: object
      required: [capabilityId, capabilityName, capabilityCategory, capabilityOwner, platformId]
      properties:
        capabilityId:
          type: string
          example: PUBLISHING
        capabilityName:
          type: string
        capabilityDescription:
          type: string
        capabilityCategory:
          type: string
          enum: [FOUNDATION_GOVERNANCE, GLOBAL_DEPENDENCY, YOUTUBE_BUSINESS]
        capabilityOwner:
          type: string
          enum: [PLATFORM, GLOBAL_ECOSYSTEM]
        platformId:
          type: string
        currentStatus:
          type: string
        lifecycleStatus:
          type: string
        version:
          type: string
        evidenceStatus:
          type: string
        confidenceLevel:
          type: string
        origin:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string
        requiredGlobalServices:
          type: array
          items:
            type: string
        requiredContracts:
          type: array
          items:
            type: string
        implementationStatus:
          type: string
        certificationStatus:
          type: string
        lastUpdated:
          type: string
          format: date

    CapabilityRegistry:
      type: object
      required: [schemaVersion, artifactVersion, capabilities]
      properties:
        schemaVersion:
          type: string
        artifactVersion:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        evidence:
          type: object

    BoundaryRegistry:
      type: object
      required:
        - schemaVersion
        - artifactType
        - artifactVersion
        - platformId
        - currentSprint
      properties:
        schemaVersion:
          type: string
        artifactType:
          type: string
          example: PLATFORM_BOUNDARY_REGISTRY
        artifactVersion:
          type: string
        platformId:
          type: string
        currentSprint:
          type: string
          example: AAT-YTOS-SPRINT-0.0.4
        platformInternalModules:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryModule'
        platformOwnedDatabaseObjects:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryDatabaseObject'
        platformPublicApis:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryPublicApi'
        platformPublicEvents:
          type: array
          items:
            type: object
        consumedGlobalApis:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryConsumedContract'
        consumedGlobalEvents:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryConsumedContract'
        forbiddenDependencies:
          type: array
          items:
            type: string
        forbiddenDatabaseAccess:
          type: array
          items:
            type: string
        externalProviders:
          type: array
          items:
            type: object
        allowedNetworkDestinations:
          type: array
          items:
            type: object
        documentation:
          type: string

    BoundaryModule:
      type: object
      required: [id, classification, status, origin]
      properties:
        id:
          type: string
        classification:
          type: string
        status:
          type: string
        origin:
          type: string

    BoundaryDatabaseObject:
      type: object
      required: [name, prismaModel, classification, status]
      properties:
        name:
          type: string
          example: platform_runtime_metadata
        prismaModel:
          type: string
          example: PlatformRuntimeMetadata
        classification:
          type: string
        status:
          type: string

    BoundaryPublicApi:
      type: object
      required: [method, path, origin]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        path:
          type: string
        origin:
          type: string

    BoundaryConsumedContract:
      type: object
      required: [id, direction, status]
      properties:
        id:
          type: string
          example: GLOBAL_ECOSYSTEM_API_V1
        direction:
          type: string
          enum: [CONSUMED_API, CONSUMED_EVENT]
        status:
          type: string
          example: AUTHORITATIVE_CONTRACT_NOT_AVAILABLE
        origin:
          type: string
    HealthManifest:
      type: object
      required:
        - schemaVersion
        - artifactVersion
        - validationStatus
        - networkRequestPerformed
        - lastValidationTimestamp
      properties:
        schemaVersion:
          type: string
        artifactType:
          type: string
          example: PLATFORM_HEALTH_MANIFEST
        artifactVersion:
          type: string
        currentGate:
          type: string
        currentSprint:
          type: string
        currentPhase:
          type: string
        architectureComplianceScore:
          $ref: '#/components/schemas/DerivedScore'
        repositoryHealthScore:
          $ref: '#/components/schemas/DerivedScore'
        foundationCompletion:
          $ref: '#/components/schemas/DerivedScore'
        overallReadiness:
          $ref: '#/components/schemas/DerivedScore'
        readiness:
          $ref: '#/components/schemas/ReadinessModel'
        validationStatus:
          type: string
          enum: [VALID, INVALID]
        lastValidationTimestamp:
          type: string
          format: date-time
        networkRequestPerformed:
          type: boolean
          example: false
        evidence:
          type: object

    DerivedScore:
      type: object
      required: [value, passed, total, status]
      properties:
        value:
          type: integer
        passed:
          type: integer
        total:
          type: integer
        status:
          type: string
          enum: [VALID, INVALID]
        basis:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      required: [id, passed]
      properties:
        id:
          type: string
        passed:
          type: boolean
        origin:
          type: string

    ReadinessModel:
      type: object
      required: [value, passed, total, status, readinessStatus, blockingItems]
      properties:
        value:
          type: integer
        passed:
          type: integer
        total:
          type: integer
        status:
          type: string
          enum: [VALID, INVALID]
        readinessStatus:
          type: string
          enum: [READY, BLOCKED]
        blockingItems:
          type: array
          items:
            type: string

    ContractSummary:
      type: object
      description: API/event contract registry summary and version matrix.
      properties:
        apis:
          type: array
          items:
            $ref: '#/components/schemas/ContractRecord'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ContractRecord'
        versions:
          type: array
          items:
            type: string
        compatibility:
          type: string
          example: BLOCKED_MISSING_AUTHORITATIVE_CONTRACT

    ContractRecord:
      type: object
      required: [id, contractVersion, lifecycle, compatibility]
      properties:
        id:
          type: string
          example: GLOBAL_ECOSYSTEM_API_V1
        contractVersion:
          type: string
          example: v1
        lifecycle:
          type: string
          enum: [ACTIVE, PLACEHOLDER]
        compatibility:
          type: string
          enum: [VERIFIED, BLOCKED_MISSING_AUTHORITATIVE_CONTRACT]
        direction:
          type: string
          enum: [OWNED, CONSUMED]
    IntegrationStatus:
      type: object
      required: [globalEcosystem, networkRequestPerformed, checkedAt]
      properties:
        globalEcosystem:
          type: object
          required: [apiStatus, eventsStatus]
          properties:
            apiStatus:
              type: string
              example: AUTHORITATIVE_CONTRACT_NOT_AVAILABLE
            eventsStatus:
              type: string
              example: AUTHORITATIVE_CONTRACT_NOT_AVAILABLE
            integrationConfigured:
              type: boolean
        networkRequestPerformed:
          type: boolean
          example: false
        checkedAt:
          type: string
          format: date-time

    IntegrationContracts:
      type: object
      required: [apis, events, versions]
      properties:
        apis:
          type: array
          items:
            $ref: '#/components/schemas/ContractRecord'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ContractRecord'
        versions:
          type: array
          items:
            type: string

    ChannelCreateRequest:
      type: object
      required: [channelId, title]
      properties:
        channelId:
          type: string
          description: External YouTube channel identifier.
          example: UC-lorem-ipsum
        title:
          type: string
          description: Display title of the channel.
        description:
          type: string
        ownerUserId:
          type: string
          description: Platform user reference that owns the channel linkage.

    Channel:
      type: object
      required: [id, channelId, title, status]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [LINKED, PENDING, UNLINKED]
        linkedAt:
          type: string
          format: date-time

    VideoCreateRequest:
      type: object
      required: [title, channelId]
      properties:
        title:
          type: string
        channelId:
          type: string
        description:
          type: string
        publishAt:
          type: string
          format: date-time
        visibility:
          type: string
          enum: [PRIVATE, UNLISTED, PUBLIC]

    Video:
      type: object
      required: [id, title, channelId, status]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [DRAFT, SCHEDULED, PUBLISHED, FAILED]
        publishAt:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request payload or parameters (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Bearer token (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but lacking the required permission (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'