components:
  securitySchemes:
    BearerToken: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    Meta: { type: object, required: [correlationId, timestamp], properties: { correlationId: { type: string }, timestamp: { type: string, format: date-time } } }
    ErrorBody: { type: object, required: [error], properties: { error: { type: object, required: [code, message, correlationId, retryable], properties: { code: { type: string }, message: { type: string }, correlationId: { type: string }, retryable: { type: boolean } } } } }
    AuthUser: { type: object, required: [id, email, role, permissions], properties: { id: { type: string }, email: { type: string, format: email }, role: { type: string }, permissions: { type: array, items: { type: string } } } }
    User: { type: object, required: [id, name, email, role, status], properties: { id: { type: string }, name: { type: string }, email: { type: string }, role: { type: string, enum: [creator, admin, viewer] }, status: { type: string, enum: [ACTIVE, SUSPENDED, PENDING] } } }
    Channel: { type: object, required: [id, name, ownerId, status, availableActions], properties: { id: { type: string }, name: { type: string }, ownerId: { type: string }, status: { type: string, enum: [APPROVED, PENDING_REVIEW, RESTRICTED] }, availableActions: { type: array, items: { type: string, enum: [APPROVE, RESTRICT, REQUEST_CHANGES] } } } }
    AIConfig: { type: object, required: [model, temperature, maxTokens, dailyVideoLimit], properties: { model: { type: string }, temperature: { type: number }, maxTokens: { type: integer }, dailyVideoLimit: { type: integer } } }
    AuditLog: { type: object, required: [id, timestamp, actor, action, target, category], properties: { id: { type: string }, timestamp: { type: string, format: date-time }, actor: { type: string }, action: { type: string }, target: { type: string }, category: { type: string, enum: [USER, CHANNEL, SYSTEM] } } }
    HealthMetric: { type: object, required: [name, status, detail], properties: { name: { type: string }, status: { type: string, enum: [GREEN, YELLOW, RED] }, detail: { type: string } } }
    SyncStatus: { type: object, required: [status, connectionHealth, lastSynchronizedAt, networkRequestPerformed], properties: { status: { type: string, enum: [ACTIVE, IDLE, ERROR, DISCONNECTED] }, connectionHealth: { type: string }, lastSynchronizedAt: { type: string, format: date-time }, networkRequestPerformed: { type: boolean } } }
    SyncEvent: { type: object, required: [id, timestamp, status, detail], properties: { id: { type: string }, timestamp: { type: string, format: date-time }, status: { type: string, enum: [SUCCESS, WARNING, FAILED] }, detail: { type: string } } }
    Conflict: { type: object, required: [id, subject, localDecision, globalRecommendation, resolution], properties: { id: { type: string }, subject: { type: string }, localDecision: { type: string }, globalRecommendation: { type: string }, resolution: { type: string, enum: [UNRESOLVED, ACCEPT_LOCAL, ACCEPT_GLOBAL, MANUAL_OVERRIDE] } } }
    Model: { type: object, required: [id, name, version, scope, active, releasedAt], properties: { id: { type: string }, name: { type: string }, version: { type: string }, scope: { type: string, enum: [LOCAL_DIRECTOR, GLOBAL_AI_CORE] }, active: { type: boolean }, releasedAt: { type: string, format: date-time } } }
    Workflow: { type: object, required: [id, userId, title, status, currentStage, progress, stages, logs, createdAt], properties: { id: { type: string }, userId: { type: string }, title: { type: string }, status: { type: string, enum: [RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED] }, currentStage: { type: string, enum: [IDEA, SCRIPT, MUSIC, VIDEO, THUMBNAIL, QUALITY, PUBLISH] }, progress: { type: integer, minimum: 0, maximum: 100 }, stages: { type: array, items: { type: object, required: [stage, status, estimatedExecutionSeconds], properties: { stage: { type: string }, status: { type: string }, estimatedExecutionSeconds: { type: integer, enum: [1, 2, 3] } } } }, logs: { type: array, items: { type: string } }, createdAt: { type: string, format: date-time } } }
    WorkflowHistory: { type: object, required: [id, workflowId, timestamp, event, detail], properties: { id: { type: string }, workflowId: { type: string }, timestamp: { type: string, format: date-time }, event: { type: string }, detail: { type: string } } }
    PromptInput: { type: object, required: [name, content, model, temperature, maxTokens], properties: { name: { type: string }, content: { type: string }, model: { type: string, enum: [gpt-4, gpt-3.5, claude] }, temperature: { type: number }, maxTokens: { type: integer } } }
    Prompt: { allOf: [{ $ref: '#/components/schemas/PromptInput' }, { type: object, required: [id, versions, performance], properties: { id: { type: string }, versions: { type: array, items: { type: object, required: [version, content, createdAt], properties: { version: { type: integer }, content: { type: string }, createdAt: { type: string, format: date-time } } } }, performance: { type: object, required: [successRatePercent, averageTokens, averageLatencyMs], properties: { successRatePercent: { type: number }, averageTokens: { type: number }, averageLatencyMs: { type: number } } } } }] }
    SuccessCurrent: { type: object, required: [overallScore, evaluatedAt, classification], properties: { overallScore: { type: integer, minimum: 0, maximum: 100 }, evaluatedAt: { type: string, format: date-time }, classification: { type: string } } }
    SuccessCategory: { type: object, required: [id, name, score, weight, detail], properties: { id: { type: string }, name: { type: string }, score: { type: integer, minimum: 0, maximum: 100 }, weight: { type: integer }, detail: { type: string } } }
    HistoryPoint: { type: object, required: [date, score], properties: { date: { type: string, format: date }, score: { type: integer, minimum: 0, maximum: 100 } } }
    Improvement: { type: object, required: [id, priority, suggestion, expectedImpact], properties: { id: { type: string }, priority: { type: string, enum: [HIGH, MEDIUM, LOW] }, suggestion: { type: string }, expectedImpact: { type: string } } }
    TwinStatus: { type: object, required: [status, autonomyEnabled, networkRequestPerformed], properties: { status: { type: string, enum: [INACTIVE, LEARNING, ACTIVE, ERROR] }, autonomyEnabled: { type: boolean }, networkRequestPerformed: { type: boolean } } }
    TwinDecision: { type: object, required: [id, timestamp, decision, outcome, performanceNote], properties: { id: { type: string }, timestamp: { type: string, format: date-time }, decision: { type: string }, outcome: { type: string, enum: [SUCCESS, REVIEW, FAILED] }, performanceNote: { type: string } } }
    TwinLearning: { type: object, required: [id, timestamp, source, summary], properties: { id: { type: string }, timestamp: { type: string, format: date-time }, source: { type: string }, summary: { type: string } } }
    TwinRecommendation: { type: object, required: [id, idea, confidencePercent, rationale], properties: { id: { type: string }, idea: { type: string }, confidencePercent: { type: number, minimum: 0, maximum: 100 }, rationale: { type: string } } }
    GatewayStatus: { type: object, required: [status, externalRequestPerformed, retryPolicy, circuitBreaker], properties: { status: { type: string, enum: [ACTIVE, DEGRADED, DOWN] }, externalRequestPerformed: { type: boolean }, retryPolicy: { type: string }, circuitBreaker: { type: string } } }
    GatewayEndpoint: { type: object, required: [key, name, capability, rateLimitPerMinute], properties: { key: { type: string }, name: { type: string }, capability: { type: string, enum: [Identity, Security, AI Core, Wallet, Payment] }, rateLimitPerMinute: { type: integer } } }
    GatewayLog: { type: object, required: [id, timestamp, endpoint, status, latencyMs, retryCount, circuitState], properties: { id: { type: string }, timestamp: { type: string, format: date-time }, endpoint: { type: string }, status: { type: string, enum: [SUCCESS, THROTTLED, FALLBACK] }, latencyMs: { type: integer }, retryCount: { type: integer }, circuitState: { type: string, enum: [CLOSED, OPEN] } } }
    GatewayHealth: { type: object, required: [metric, value, status], properties: { metric: { type: string }, value: { type: string }, status: { type: string, enum: [HEALTHY, WARNING] } } }
  responses:
    Error: { description: "Authentication, authorization, or validation error", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
    AuthLoginResponse: { description: Authentication envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: object, required: [token, refreshToken, user], properties: { token: { type: string }, refreshToken: { type: string }, user: { $ref: '#/components/schemas/AuthUser' } } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    AuthRefreshResponse: { description: Refreshed authentication envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: object, required: [token, refreshToken], properties: { token: { type: string }, refreshToken: { type: string } } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    LogoutResponse: { description: Logout envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: object, required: [loggedOut], properties: { loggedOut: { type: boolean, enum: [true] } } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    UsersResponse: { description: Users envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/User' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    UserResponse: { description: User envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/User' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    ChannelsResponse: { description: Channels envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/Channel' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    ChannelResponse: { description: Channel envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/Channel' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
    AIConfigResponse: { description: AI configuration envelope, content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: '#/components/schemas/AIConfig' }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
