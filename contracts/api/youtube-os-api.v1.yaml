# AIArbiTech YouTube OS — Internal API Contract
# OpenAPI 3.0.3 | Status: COMPATIBILITY_PLACEHOLDER | NOT_VERIFIED
# This file documents internal YouTube OS APIs. It is a controlled publication boundary
# artifact in the `contracts/` directory. It authorizes no runtime and performs no network
# request. Business endpoints (channels/videos) are placeholders and require Gate 0
# authorization before implementation.

openapi: 3.0.3
info:
  title: AIArbiTech YouTube OS Internal API
  version: 1.0.0
  description: |
    Versioned internal API contract for AIArbiTech YouTube OS (Platform ID
    PLATFORM_YOUTUBE_OS). All responses use a shared envelope of `data` + `meta`
    (success) or `error` (failure), matching the repository contracts in
    backend/src/contracts/api.ts.

    Status: COMPATIBILITY_PLACEHOLDER / NOT_VERIFIED. Business endpoints are
    placeholders and are NOT_IMPLEMENTED. No placeholder authorizes production
    integration. Authentication uses a BearerToken security scheme; each operation
    declares an x-permission requirement.

tags:
  - name: PlatformFoundation
    description: Platform identity, manifest, health, compatibility, and governance surfaces.
  - name: RegistryAccess
    description: Read-only registry access (features, capabilities, boundaries, contracts).
  - name: IntegrationGateway
    description: Single permitted boundary for Global Ecosystem cross-platform integration.
  - name: BusinessEndpoints
    description: Placeholder YouTube business endpoints. NOT_IMPLEMENTED; pending Gate 0.

security:
  - BearerToken: []
paths:
  /api/v1/platform/manifest:
    get:
      tags:
        - PlatformFoundation
      summary: Return the YouTube OS platform manifest.
      description: |
        Returns platform identity and Global Ecosystem compatibility metadata
        (Platform ID PLATFORM_YOUTUBE_OS). Read-only. Repository-derived.
      security:
        - BearerToken: []
      x-permission: PLATFORM_READ_MANIFEST
      responses:
        '200':
          description: Platform manifest returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/PlatformManifest'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/platform/health:
    get:
      tags:
        - PlatformFoundation
      summary: Return platform liveness and readiness summary.
      description: |
        Returns platform health/readiness status. Detailed scoring is exposed via
        /api/v1/platform/health/summary and /api/v1/platform/health/readiness.
        Read-only. Repository-derived.
      security:
        - BearerToken: []
      x-permission: PLATFORM_READ_HEALTH
      responses:
        '200':
          description: Platform health status returned.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/platform/compatibility:
    get:
      tags:
        - PlatformFoundation
      summary: Return Global Ecosystem compatibility status.
      description: |
        Returns the compatibility report for the platform against the declared
        Global Ecosystem capabilities. Performs no network request;
        networkRequestPerformed is always false.
      security:
        - BearerToken: []
      x-permission: PLATFORM_READ_COMPATIBILITY
