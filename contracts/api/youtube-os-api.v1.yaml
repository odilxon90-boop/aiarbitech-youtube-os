  /api/v1/gateway/call:
    post:
      tags:
        - IntegrationGateway
      summary: Execute a gateway call.
      description: Executes a call to a Global Ecosystem integration endpoint.
      security:
        - BearerToken: []
      x-permission: gateway:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId, method]
              properties:
                endpointId:
                  type: string
                  description: ID of the integration endpoint.
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE]
                path:
                  type: string
                  description: Optional path override.
                body:
                  type: object
                  description: Optional request body.
      responses:
        '200':
          description: Gateway call completed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/GatewayCallResult'
                  meta:
